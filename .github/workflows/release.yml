name: Release
on:
  push:
    tags:
      - 'v*'

env:
  SINGBOX_VERSION: v1.12.22

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Cache libbox AAR
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-${{ env.SINGBOX_VERSION }}

      - name: Build libbox.aar
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.8
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.8
          gomobile init
          git clone --depth 1 --branch ${{ env.SINGBOX_VERSION }} https://github.com/SagerNet/sing-box /tmp/sing-box
          cd /tmp/sing-box
          gomobile bind -v -androidapi 26 -javapkg=io.nekohasekai -libname=box \
            -tags "with_gvisor,with_quic,with_wireguard,with_ech,with_utls,with_clash_api" \
            ./experimental/libbox/
          cp libbox.aar $GITHUB_WORKSPACE/app/libs/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          cat > keystore.properties <<EOF
          storeFile=../keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Build signed Release APK
        run: ./gradlew assembleRelease

      - name: Build signed Release AAB
        run: ./gradlew bundleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'NuggetVPN Mobile ${{ github.ref_name }}'
          body: 'See the assets to download this version and install.'
          draft: true
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
